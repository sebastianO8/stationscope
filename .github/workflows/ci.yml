name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The full suite -- including the `pdf` marked tests that re-parse the
      # DOH registry PDFs -- runs in well under a minute, so there is no
      # reason for CI to skip anything.
      - name: Run tests
        run: pytest -q
